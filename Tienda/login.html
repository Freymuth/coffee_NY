  <main>
    <section>
      <h2>Iniciar Sesión</h2>

      <form id="form_login">
        <fieldset>
          <legend>Acceso a tu Cuenta</legend>

          <p>
            <label for="correo">Correo electrónico:</label><br>
            <input type="text" id="correo" name="correo" placeholder="ejemplo@duoc.cl">
            <span id="mensaje_correo"></span>
          </p>

          <p>
            <label for="password">Contraseña:</label><br>
            <input type="password" id="password" name="password">
            <span id="mensaje_password"></span>
          </p>

          <p>
            <button type="button" onclick="validarLogin()">Ingresar</button>
          </p>
        </fieldset>
      </form>
    </section>
